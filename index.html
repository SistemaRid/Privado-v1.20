function getRidDateSafe(r) {
  // padrão correto
  if (r?.emissionDate && typeof r.emissionDate.toDate === "function") {
    return r.emissionDate.toDate();
  }

  // fallback: createdAt
  if (r?.createdAt && typeof r.createdAt.toDate === "function") {
    return r.createdAt.toDate();
  }

  // último fallback: string
  if (r?.date) {
    const d = new Date(r.date + "T00:00:00");
    if (!isNaN(d.getTime())) return d;
  }

  return null;
}

function autoGrowTextarea(el) {
  if (!el) return;

  el.style.height = (el.scrollHeight + 2) + "px";

function autoGrowAllTextareas(root = document) {

function getEmissionDateOnly(r) {
  // Só vale se for Timestamp do Firestore
  if (r?.emissionDate && typeof r.emissionDate.toDate === "function") {
    return r.emissionDate.toDate();
  }
  return null; // sem fallback pra createdAt

function getSearchSelectedMonthYear() {
  const now = new Date();
  const monthEl = document.getElementById('searchMonth');
  const yearEl = document.getElementById('searchYear');

  const month = monthEl?.value ? Number(monthEl.value) : (now.getMonth() + 1);
  const year = yearEl?.value ? Number(yearEl.value) : now.getFullYear();

  return { month, year };
}

function isInMonthYear(d, month, year) {
  return d && d.getFullYear() === year && (d.getMonth() + 1) === month;
}

function isBeforeMonthYear(d, month, year) {
  if (!d) return false;
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  return (y < year) || (y === year && m < month);
}

function splitRidsForSearchView(baseRids, month, year) {
  const clean = (baseRids || []).filter(r => !r?.deleted);

  // ✅ RIDs do mês selecionado (qualquer status)
  const monthRids = clean
    .filter(r => {
      const d = getEmissionDateOnly(r);
      return isInMonthYear(d, month, year);
    })
    .sort((a, b) => {
      const da = getEmissionDateOnly(a);
      const db = getEmissionDateOnly(b);
      return (db?.getTime?.() || 0) - (da?.getTime?.() || 0);
    });

  // 🚨 Atrasados = emitidos antes do mês selecionado e AINDA PENDENTES
  const atrasados = clean
    .filter(r => {
      const d = getEmissionDateOnly(r);
      if (!isBeforeMonthYear(d, month, year)) return false;

      const st = String(r.status || '').toUpperCase();
      const isPendente = (st !== 'CORRIGIDO' && st !== 'ENCERRADO' && st !== 'EXCLUIDO');
      return isPendente;
    })
    // (opcional) mais antigos primeiro pra dar senso de prioridade
    .sort((a, b) => {
      const da = getEmissionDateOnly(a);
      const db = getEmissionDateOnly(b);
      return (da?.getTime?.() || 0) - (db?.getTime?.() || 0);
    });

  return { atrasados, monthRids };
}

function getMonthStartEnd(date = new Date()) {
  const start = new Date(date.getFullYear(), date.getMonth(), 1, 0, 0, 0, 0);
  const end = new Date(date.getFullYear(), date.getMonth() + 1, 0, 23, 59, 59, 999);
  return { start, end };
}

function isResolvedStatus(status) {
  const st = String(status || '').toUpperCase();
  return st === 'CORRIGIDO' || st === 'ENCERRADO';
}

function calcMyPerformanceStats(myRids) {
  const clean = (myRids || []).filter(r => !r?.deleted);

  const upper = (v) => String(v || '').toUpperCase();

  // ✅ CONTAGEM GERAL (vida toda) -> para os cards
  const total = clean.length;
  const corrigidos = clean.filter(r => upper(r.status) === 'CORRIGIDO').length;
  const emAndamento = clean.filter(r => upper(r.status) === 'EM ANDAMENTO').length;
  const vencidos = clean.filter(r => upper(r.status) === 'VENCIDO').length;

  // ✅ MÊS ATUAL (para a linha de baixo)
  const { start, end } = getMonthStartEnd(new Date());
  const monthRids = clean.filter(r => {
    const d = r.createdAt?.toDate?.();
    return d && d >= start && d <= end;
  });

  const monthTotal = monthRids.length;

  // ✅ meta pessoal (mês)
  const metaPessoal = 4;
  const bateuMeta = monthTotal >= metaPessoal;
  const faltamMeta = Math.max(metaPessoal - monthTotal, 0);

  return {
    // cards (geral)
    total,
    corrigidos,
    emAndamento,
    vencidos,

    // linha de baixo (mês atual)
    monthTotal,
    metaPessoal,
    bateuMeta,
    faltamMeta
  };
}

async function getNextRidNumberSafe() {
  const counterRef = db.collection("counters").doc("rids");

  return db.runTransaction(async (transaction) => {
    const doc = await transaction.get(counterRef);

    if (!doc.exists) {
      throw "Documento counters/rids não existe";
    }

    const last = doc.data().lastNumber || 0;
    const next = last + 1;

    transaction.update(counterRef, { lastNumber: next });

    return String(next).padStart(5, "0");
  });
}

function toFirestoreDateFromInput(dateStr) {
  // dateStr esperado: "YYYY-MM-DD"
  if (!dateStr) return null;

  const [y, m, d] = dateStr.split('-').map(Number);
  if (!y || !m || !d) return null;

  // ✅ meio-dia local (blindado contra fuso)
  const safeLocal = new Date(y, m - 1, d, 12, 0, 0);

  // 🔥 Se você salva como Timestamp do Firestore:
  return firebase.firestore.Timestamp.fromDate(safeLocal);

  // Se você salva como Date puro, use:
  // return safeLocal;
}

   function formatDate(date) {
  if (!date) return '-';

  let d;

  // Firestore Timestamp
  if (typeof date.toDate === 'function') {
    d = date.toDate();
  } else {
    d = new Date(date);
  }

  // 🔒 NORMALIZA PARA DATA LOCAL (remove efeito de fuso)
  const localDate = new Date(
    d.getFullYear(),
    d.getMonth(),
    d.getDate()
  );

  return localDate.toLocaleDateString('pt-BR');
}

    function getFilteredRids() {
  const monthSelect = document.getElementById('dashboardMonth');
  const yearInput = document.getElementById('dashboardYear');
  const sectorSelect = document.getElementById('dashboardSector');

  let filtered = allRids.filter(r => !r.deleted);

  const now = new Date();
  const month = monthSelect?.value
    ? parseInt(monthSelect.value)
    : now.getMonth() + 1;

  const year = yearInput?.value
    ? parseInt(yearInput.value)
    : now.getFullYear();

  // 🔹 FILTRO MÊS + ANO
  filtered = filtered.filter(r => {
    if (!r.emissionDate) return false;
    const d = r.emissionDate.toDate();
    return (
      d.getFullYear() === year &&
      d.getMonth() + 1 === month
    );
  });

  // 🔹 FILTRO SETOR
  if (sectorSelect?.value) {
    filtered = filtered.filter(r => r.sector === sectorSelect.value);

    async function garantirNumeracaoRids() {
  const snapshot = await db.collection("rids").get();

  let maiorNumero = 0;
  const ridsSemNumero = [];

  snapshot.forEach(doc => {
    const data = doc.data();

    if (data.ridNumber) {
      const num = parseInt(data.ridNumber, 10);
      if (!isNaN(num) && num > maiorNumero) {
        maiorNumero = num;
      }
    } else {
      ridsSemNumero.push(doc.ref);
    }
  });

  let proximo = maiorNumero;

  for (const ref of ridsSemNumero) {
    proximo++;
    const ridNumber = String(proximo).padStart(5, "0");

    await ref.update({ ridNumber });
  }

  console.log("✅ Numeração de RIDs garantida");
}

    async function updateRid(ridId, updates) {
      try {
      // =========================
  // 🔔 Validação de STATUS
  // =========================
  if (updates.status) {

   // CORRIGIDO (somente Ações Corretivas obrigatórias)
if (updates.status === 'CORRIGIDO') {
  if (!updates.correctiveActions || updates.correctiveActions.trim() === '') {
    showToast(
      '⚠️ Para status "CORRIGIDO", é obrigatório preencher Ações Corretivas.',
      'error'
    );
    return false;
  }
}


    // ENCERRADO
    if (updates.status === 'ENCERRADO') {
      if (
        !updates.observations || updates.observations.trim() === '' ||
        !updates.conclusion || updates.conclusion.trim() === ''
      ) {
        showToast(
          '⚠️ Para status "ENCERRADO", é obrigatório preencher Observações e Conclusão.',
          'error'
        );
        return false;
      }
    }

    // VENCIDO → não valida nada
  }

    // Se virou CORRIGIDO, grava data
    if (updates.status === 'CORRIGIDO' && !updates.conclusionDate) {
      updates.conclusionDate = firebase.firestore.FieldValue.serverTimestamp();
    }

    const ridSnap = await db.collection('rids').doc(ridId).get();
    const rid = ridSnap.exists ? { id: ridSnap.id, ...ridSnap.data() } : null;


if (!rid) {
  showToast('RID não encontrada', 'error');
  return false;
}

if (rid.deleted) {
  showToast('RID removido não pode ser alterado', 'error');
  return false;
}

// 📩 Se trocou (ou removeu) o líder, reativa envio do e-mail (Worker)
if (Object.prototype.hasOwnProperty.call(updates, 'responsibleLeader')) {
  const newLeader = updates.responsibleLeader || null;
  const oldLeader = rid?.responsibleLeader || null;

  if (newLeader !== oldLeader) {
    updates.emailSent = false;
    updates.emailSentAt = null;
    updates.lastNotifiedLeader = null;
  }
}



await db.collection('rids').doc(ridId).update(updates);

// 🧾 Auditoria
const changes = {};

for (const key in updates) {
  if (rid[key] !== updates[key]) {
    changes[key] = {
      from: rid[key] || null,
      to: updates[key]
    };
  }
}

    // 🔔 Notifica admins
    if (updates.status) {
      const adminUsers = allUsers.filter(u => u.isAdmin && u.id !== currentUser.uid);
      for (const admin of adminUsers) {
        await createNotification(admin.id, {
          type: 'rid_status_changed',
          ridId: ridId,
          ridNumber: rid?.ridNumber || '',
          title: 'Status da RID Atualizado',
          message: `RID #${rid?.ridNumber} foi atualizada para: ${updates.status}`,
          ridLocation: rid?.location || '',
          deadline: null
        });
      }
    }

    // 🔔 Notifica responsável
    if (
  currentUserData.isDeveloper && // ← só dev
  rid?.responsibleLeader &&
  rid.responsibleLeader !== currentUser.uid
) {
  await createNotification(rid.responsibleLeader, {
    type: 'rid_updated',
    ridId: ridId,
    ridNumber: rid?.ridNumber || '',
    title: 'RID Atualizada',
    message: `A RID #${rid?.ridNumber} foi atualizada por ${currentUserData.name}`,
    ridLocation: rid?.location || '',
    deadline: null
  });
}

    // 🧹 Fecha o modal de detalhes
    document.querySelectorAll('.modal-backdrop').forEach(m => m.remove());

    // 🔥 NÃO usa loadRids — realtime já atualiza
    // 🔒 Proteção de role
if (!currentUserData?.isAdmin && !currentUserData?.isDeveloper) {
  renderEmployeeDashboard();
} else {
  renderAdminDashboard();
}
    if (window.currentPage === 'search') renderSearchPage();
    if (window.currentPage === 'designated') renderDesignatedPage();

    showToast('RID atualizada com sucesso!');
    return true;
 } catch (error) {
  console.error("Erro Firestore:", error);

  // Se o erro for só da auditoria, ignoramos
  if (
    error.code === 'permission-denied' ||
    error.message?.includes('Missing or insufficient permissions')
  ) {
    showToast('RID atualizada com sucesso!');
    return true;
  }

  // Erro real
  showToast('Erro ao atualizar RID: ' + error.message, 'error');
  return false;
}
}

    async function markNotificationAsRead(notificationId) {

        await db.collection('notifications').doc(notificationId).update({
          read: true

        const notification = userNotifications.find(n => n.id === notificationId);
        if (notification) {

        updateNotificationBadge();
        renderNotificationsList();

    async function markAllAsRead() {
      try {
        const batch = db.batch();
        const unreadNotifications = userNotifications.filter(n => !n.read);
        
        unreadNotifications.forEach(notification => {
          const ref = db.collection('notifications').doc(notification.id);
          batch.update(ref, { read: true });
        });
        
        await batch.commit();
        
        // Update local state
        userNotifications.forEach(n => n.read = true);
        
        updateNotificationBadge();
        renderNotificationsList();
        showToast('Todas as notificações foram marcadas como lidas');

    // ✅ Deleta (exclusão lógica) um RID e grava o motivo corretamente
async function deleteRid(ridId, reason) {
  const ridRef = db.collection('rids').doc(ridId);
  const ridSnap = await ridRef.get();

  if (!ridSnap.exists) {
    throw new Error('RID não encontrada para exclusão');
  }

  const ridData = ridSnap.data() || {};
  const previousObs = ridData?.observations || '';

  const safeReason = (reason || '').trim() || 'Solicitação de exclusão aprovada';

  const deleteNote =
`[${new Date().toLocaleDateString('pt-BR')}] RID removido do sistema
Motivo: ${safeReason}
Removido por: ${currentUserData?.name || 'DEV'}`;

  await ridRef.update({
    deleted: true,
    status: 'EXCLUIDO',
    deletedAt: firebase.firestore.FieldValue.serverTimestamp(),

    deletedBy: {
      uid: currentUser?.uid || null,
      name: currentUserData?.name || 'DEV',
      role: isDeveloper() ? 'DEVELOPER' : 'ADMIN'
    },

    // ✅ aqui fica o motivo “limpo” pra UI usar direto
    deleteReason: safeReason,

    // ✅ aqui fica o histórico em observações (como você quer ver no modal)
    observations: previousObs ? (previousObs + '\n\n' + deleteNote) : deleteNote,

    // (mantém seu comportamento saudável)
    emailSent: false,
    emailSentAt: null,
    lastNotifiedLeader: null
  });
}

async function approveRidDeletionRequest(requestId) {
  try {
    if (!isDeveloper()) {
      showToast('Acesso negado', 'error');
      return;
    }

    const reqRef = db.collection('deleteRequests').doc(requestId);
    const reqSnap = await reqRef.get();

    if (!reqSnap.exists) {
      showToast('Solicitação não encontrada', 'error');
      return;
    }

    const req = reqSnap.data();
    const ridId = req?.ridId;
    const reason = (req?.reason || '').trim() || 'Aprovado sem motivo informado';

    if (!ridId) {
      showToast('Solicitação inválida (ridId ausente)', 'error');
      return;
    }

    // 1) marca request como aprovada
    await reqRef.update({
      status: 'approved',
      reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
      reviewedBy: {
        uid: currentUser.uid,
        name: currentUserData?.name || 'DEV'
      }
    });

    // 2) executa a exclusão REAL do RID (sem usar "updates")
    await deleteRid(ridId, reason);

    // 3) recarrega a página de solicitações
    renderRequestsPage();

    showToast('Solicitação aprovada e o RID foi excluído!');
  } catch (error) {
    showToast('Erro ao aprovar solicitação: ' + error.message, 'error');
  }
}

    function getRidDateSafe(r) {
  if (r?.emissionDate && typeof r.emissionDate.toDate === "function") {
    return r.emissionDate.toDate();
  }
  if (r?.createdAt && typeof r.createdAt.toDate === "function") {
    return r.createdAt.toDate();
  }
  if (r?.date) {
    const d = new Date(r.date + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }
  return null;
}

    function getEmployeesWithoutRidsThisMonth(allUsers, filteredRids) {
  const now = new Date();

  // setor selecionado no filtro da dashboard
  const sectorSelect = document.getElementById('dashboardSector');
  const selectedSector = sectorSelect?.value || '';

  // quem emitiu RID no mês (já respeita mês + setor)
  const emittersThisMonth = new Set(
    filteredRids
      .map(r => r.emitterId)
      .filter(Boolean)
  );

  return allUsers
    // somente funcionários
    .filter(u => true)

    // 🔥 FILTRO POR SETOR (AQUI ESTAVA FALTANDO)
    .filter(u => !selectedSector || u.sector === selectedSector)

    // 🔥 remove quem emitiu RID no mês
    .filter(u => !emittersThisMonth.has(u.id))

    .map(u => {
      // última RID do funcionário (se existir)
      const lastRid = allRids.filter(r => !r.deleted)
        .filter(r => r.emitterId === u.id && r.emissionDate)
        .sort((a, b) => {
  const da = getRidDateSafe(a);
  const db = getRidDateSafe(b);
  // quem não tem data vai pro final
  if (!da && !db) return 0;
  if (!da) return 1;
  if (!db) return -1;
  return db - da;
})[0];

      let lastDate = null;
let daysWithout = null;

if (lastRid) {
  lastDate = getRidDateSafe(lastRid);

  if (lastDate) {
    daysWithout = Math.floor(
      (now - lastDate) / (1000 * 60 * 60 * 24)
    );
  }
}

      return {
        id: u.id,
        name: u.name,
        lastDate,      // null → nunca emitiu
        daysWithout    // null → nunca emitiu
      };
    });
}

function hideDeletedRidTooltip() {
  if (!deletedRidTooltipEl) return;
  deletedRidTooltipEl.style.display = 'none';
}

function moveDeletedRidTooltip(mouseEvent) {
  if (!deletedRidTooltipEl || deletedRidTooltipEl.style.display === 'none') return;

  const padding = 14;
  const x = mouseEvent.clientX + padding;
  const y = mouseEvent.clientY + padding;

  const rect = deletedRidTooltipEl.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width - 10;
  const maxY = window.innerHeight - rect.height - 10;

  deletedRidTooltipEl.style.left = Math.min(x, maxX) + 'px';
  deletedRidTooltipEl.style.top  = Math.min(y, maxY) + 'px';
}

// evita XSS/HTML quebrado
function escapeHtml(str) {
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

window.showDeletedRidTooltipFromEl = showDeletedRidTooltipFromEl;
window.hideDeletedRidTooltip = hideDeletedRidTooltip;
window.moveDeletedRidTooltip = moveDeletedRidTooltip;

    // ✅ Plugin: risquinho + % fora do doughnut
const doughnutPercentCallouts = {
  id: 'doughnutPercentCallouts',
  afterDatasetsDraw(chart, args, pluginOptions) {
    const { ctx } = chart;
    const dataset = chart.data.datasets?.[0];
    if (!dataset) return;

    const meta = chart.getDatasetMeta(0);
    if (!meta?.data?.length) return;

    const data = dataset.data || [];
    const total = data.reduce((a, b) => a + (Number(b) || 0), 0);
    if (!total) return;

    const fontSize = pluginOptions?.fontSize ?? 12;
    const lineLength = pluginOptions?.lineLength ?? 14;
    const lineGap = pluginOptions?.lineGap ?? 6;
    const minPercent = pluginOptions?.minPercent ?? 3; // não polui com fatia minúscula

    ctx.save();
    ctx.font = `700 ${fontSize}px Arial`;
    ctx.fillStyle = pluginOptions?.textColor ?? '#374151'; // cinza escuro
    ctx.strokeStyle = pluginOptions?.lineColor ?? '#9CA3AF'; // cinza
    ctx.lineWidth = pluginOptions?.lineWidth ?? 2;

    meta.data.forEach((arc, i) => {
      const value = Number(data[i]) || 0;
      if (!value) return;

      const percent = (value / total) * 100;
      if (percent < minPercent) return;

      // ponto na borda da fatia
      const angle = (arc.startAngle + arc.endAngle) / 2;
      const r = arc.outerRadius;

      const x0 = arc.x + Math.cos(angle) * r;
      const y0 = arc.y + Math.sin(angle) * r;

      // pontinho fora (risquinho)
      const x1 = arc.x + Math.cos(angle) * (r + lineLength);
      const y1 = arc.y + Math.sin(angle) * (r + lineLength);

      // pequeno “cotovelo” para esquerda/direita
      const isRight = Math.cos(angle) >= 0;
      const x2 = x1 + (isRight ? lineGap : -lineGap);
      const y2 = y1;

      // desenha linha
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // texto %
      const label = `${Math.round(percent)}%`;
      ctx.textAlign = isRight ? 'left' : 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, x2 + (isRight ? 4 : -4), y2);
    });

    ctx.restore();
  }
};

    function renderRidsList(rids) {
  if (rids.length === 0) {
    return `
      <div class="bg-white rounded-xl shadow-lg p-12 text-center">
        <p class="text-gray-500 text-lg">Nenhum RID encontrado</p>
      </div>
    `;
  }

  // 📱 MOBILE → Admin ou Dev → lista simples
  if (isMobile() && isAdminOrDev()) {
    return rids.map(rid => `
      <div
        class="bg-white rounded-lg shadow-md p-4 cursor-pointer hover:bg-gray-50"
        onclick="showRidDetails('${rid.id}')"
      >
        <div class="font-bold text-gray-800 text-lg">
          RID #${rid.ridNumber}
        </div>

        <div class="text-sm text-gray-600 mt-1">
          ${rid.emitterName || 'Sem nome'}
        </div>
      </div>
    `).join('');
  }

  // 🖥️ DESKTOP → comportamento atual (NÃO MUDA)
  return rids.map(rid => `
    <div class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow cursor-pointer p-4"
         onclick="showRidDetails('${rid.id}')">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-2">
        <div class="flex items-center space-x-6 flex-1">
          <div class="flex items-center space-x-2">
            <span class="text-xs font-bold text-gray-500">Nº</span>
            <span class="px-4 py-2 text-white font-bold rounded-lg text-base"
                  style="background-color: #a8d5e2;">
              ${rid.ridNumber}
            </span>
          </div>

          <div class="w-40 min-w-0">
            <span class="text-sm font-semibold text-gray-800">
              ${rid.emitterName}
            </span>
          </div>

          <div class="flex-1 min-w-0">
            <span class="text-sm text-gray-600">
              ${rid.description.substring(0, 50)}...
            </span>
          </div>

          <div class="w-32">
            <span class="text-sm font-semibold text-gray-800">
              ${rid.unit}
            </span>
          </div>

          <div class="w-32">
            <span class="px-3 py-1 rounded-lg font-bold text-xs ${getRiskColor(rid.riskClassification)}">
              ${rid.riskClassification}
            </span>
          </div>

          <div class="w-32">
            <span class="px-3 py-1 rounded-lg font-bold text-xs ${getStatusColor(rid.status)}">
              ${rid.status}
            </span>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}


   function getStatusColor(status) {
  switch (status) {
    case 'VENCIDO':
      return 'bg-red-200 text-red-800';

    case 'ENCERRADO':
      return 'bg-gray-300 text-gray-800';

    case 'EM ANDAMENTO':
      return 'bg-yellow-200 text-yellow-800';

    case 'CORRIGIDO':
      return 'bg-green-200 text-green-800';

    default:
      return 'bg-gray-200 text-gray-800';
  }
}


    function getRiskColor(risk) {
      switch(risk) {
        case 'BAIXO': case 'Baixo': return 'bg-blue-200 text-blue-800';
        case 'MÉDIO': case 'Médio': return 'bg-yellow-200 text-yellow-800';
        case 'ALTO': case 'Alto': return 'bg-orange-200 text-orange-800';
        case 'CRÍTICO': case 'Crítico': return 'bg-red-200 text-red-800';
        default: return 'bg-gray-200 text-gray-800';
      }
    }

    function searchRids() {
      const text = document.getElementById('searchText')?.value.toLowerCase() || '';
const month = document.getElementById('searchMonth')?.value;
const year = document.getElementById('searchYear')?.value;
const sector = document.getElementById('searchSector')?.value;
const status = document.getElementById('searchStatus')?.value;

let filtered = allRids;

// 🔎 BUSCA POR TEXTO
if (text) {
  filtered = filtered.filter(r =>
    r.ridNumber?.toLowerCase().includes(text) ||
    r.emitterName?.toLowerCase().includes(text) ||
    r.location?.toLowerCase().includes(text) ||
    r.description?.toLowerCase().includes(text)
  );
}

// 📅 FILTRO MÊS + ANO
if (month || year) {
  filtered = filtered.filter(r => {
    if (!r.emissionDate) return false;
    const d = r.emissionDate.toDate();

    if (month && d.getMonth() + 1 !== Number(month)) return false;
    if (year && d.getFullYear() !== Number(year)) return false;

    return true;
  });
}

// 🏭 SETOR
if (sector) {
  filtered = filtered.filter(r => r.sector === sector);
}

// 📌 STATUS
if (status === 'SEM_LIDER') {
  // 🔥 ignora status real, mostra TODOS sem líder
  filtered = filtered.filter(r =>
    !r.responsibleLeader || r.responsibleLeader === ''
  );
} else if (status) {
  // status normal (EM ANDAMENTO, VENCIDO, CORRIGIDO)
  filtered = filtered.filter(r => r.status === status);
}


// 🔄 ATUALIZA A LISTA
document.getElementById('ridsListContainer').innerHTML =
  renderRidsList(filtered);

 }

const applyLock = () => {
  // Se for developer, NÃO bloqueia nada
  if (typeof isDeveloper === "function" && isDeveloper()) return;

  const allowedNames = new Set([
    "riskClassification",  // Classificação de Risco
    "status",              // Status
    "responsibleLeader",   // Responsável Designado
    "deadline",            // Prazo
    "observations",        // Observações
    "correctiveActions",   // Ações Corretivas
    "conclusion"           // Conclusão
  ]);

  document
    .querySelectorAll(".modal-backdrop input, .modal-backdrop select, .modal-backdrop textarea")
    .forEach(el => {
      const name = el.getAttribute("name") || "";

      // libera somente os campos permitidos
      if (allowedNames.has(name)) {
        el.disabled = false;
        el.readOnly = false;
        el.style.pointerEvents = "auto";
        el.classList.remove("bg-gray-100", "cursor-not-allowed");
        return;
      }

      el.disabled = true;
el.readOnly = true;

// ✅ textarea: deixa clicar/selecionar e garante reflow bom
if (el.tagName === "TEXTAREA") {
  el.style.pointerEvents = "auto";
} else {
  el.style.pointerEvents = "none";
}

el.classList.add("bg-gray-100", "cursor-not-allowed");
    });
};

// executa agora e reforça após render (somente admin)
applyLock();
requestAnimationFrame(applyLock);
setTimeout(applyLock, 50);
    }

function handleEncerramentoChange(select, ridId) {
  if (select.value !== 'ENCERRADO') return;

  if (!isAdmin() && !isDeveloper()) {
    showToast('Sem permissão para encerrar RID', 'error');
    select.value = 'EM ANDAMENTO';
    return;
  }

  showEncerramentoMotivoModal(ridId, select);
}

}
async function confirmarEncerramento(ridId) {
  const motivo = document.getElementById('encerramentoMotivo')?.value?.trim();

  if (!motivo || motivo.length < 5) {
    showToast('Informe um motivo válido para encerrar o RID', 'error');
    return;
  }

  const updates = {
    status: 'ENCERRADO',

    // 🔥 motivo vira ação corretiva oficial
    correctiveActions: motivo,

    conclusionDate: firebase.firestore.FieldValue.serverTimestamp()
  };

  const success = await updateRid(ridId, updates);

  if (success) {
    document
      .querySelectorAll('.modal-backdrop')
      .forEach(m => m.remove());

    showToast('RID encerrado com sucesso');
  }
}
function cancelarEncerramento(button) {
  button.closest('.modal-backdrop')?.remove();

  if (window._encerramentoSelect) {
    window._encerramentoSelect.value = 'EM ANDAMENTO';
    window._encerramentoSelect = null;
  }
}

      form.closest('.modal-backdrop').remove();
      const detailsModal = document.querySelector('.modal-backdrop');

    async function handleEditRid(event, ridId) {
      event.preventDefault();
      const form = event.target;
      const button = form.querySelector('button[type="submit"]');
      
      button.disabled = true;
      button.textContent = 'Salvando...';

      try {
        const updates = {
          emissionDate: firebase.firestore.Timestamp.fromDate(new Date(form.emissionDate.value)),
          contractType: form.contractType.value,
          unit: form.unit.value,
          sector: form.sector.value,
          location: form.location.value,
          incidentType: form.incidentType.value,
          detectionOrigin: form.detectionOrigin.value,
          riskClassification: form.riskClassification.value,
          status: form.status.value,
          description: form.description.value,
          immediateAction: form.immediateAction.value,
          correctiveActions: form.correctiveActions.value,
          conclusion: form.conclusion.value
        };

        // Admin-only fields
        if (isAdmin()) {
          const leaderId = form.responsibleLeader.value;
          updates.responsibleLeader = leaderId || null;
          updates.responsibleLeaderName = leaderId? getUserNameById(leaderId): null;
          updates.deadline = form.deadline.value ? firebase.firestore.Timestamp.fromDate(new Date(form.deadline.value)) : null;
          updates.observations = form.observations.value;
        }

        const success = await updateRid(ridId, updates);
        
        if (success) {
          form.closest('.modal-backdrop').remove();
          renderDashboard();
        } else {
          button.disabled = false;
          button.textContent = 'Salvar Alterações';
        }
      } catch (error) {
        showToast('Erro ao salvar alterações: ' + error.message, 'error');
        button.disabled = false;
        button.textContent = 'Salvar Alterações';
      }
    }

    async function syncLeadersPublic() {
  if (!isAdmin() && !isDeveloper()) return;

  try {
    const leaders = allUsers.filter(
      u => u.isAdmin === true || u.isDeveloper === true
    );

    const batch = db.batch();

    leaders.forEach(leader => {
      const ref = db.collection('leaders_public').doc(leader.id);
      batch.set(ref, {
        name: leader.name,
        sector: leader.sector || '',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    });

    await batch.commit();
  } catch (e) {
    console.warn('Erro ao sincronizar leaders_public');
  }
}

    async function handleAddEmployee(event) {
      event.preventDefault();
      const form = event.target;
      const button = form.querySelector('button[type="submit"]');
      
      button.disabled = true;
      button.textContent = 'Adicionando...';

      try {
        const name = form.name.value.toUpperCase();
        const cpf = form.cpf.value;
        const sector = form.sector.value;
        const password = form.password.value;
        const email = cpfToEmail(cpf);

        const userCredential = await secondaryAuth.createUserWithEmailAndPassword(email, password);

        
        await db.collection('users').doc(userCredential.user.uid).set({
  name,
  cpf,
  sector,
  isAdmin: false,
  isDeveloper: false,
  userType: 'Funcionário',

  async function approveRidDeletion(requestId, ridId, requesterId) {
  try {
    // 🔒 trava a UI na aba Solicitações durante a aprovação
window.currentPage = 'requests';

    const rid = allRids.find(r => r.id === ridId);

    const ridRef = db.collection('rids').doc(ridId);
    const ridSnap = await ridRef.get();
    const ridData = ridSnap.data() || {};

    // ✅ pega o motivo digitado pelo líder na solicitação (deleteRequests.reason)
const reqSnap = await db.collection('deleteRequests').doc(requestId).get();
const reqData = reqSnap.exists ? (reqSnap.data() || {}) : {};
const ridDeletionReason = (reqData.reason || '').trim() || 'Motivo não informado';


    const previousObs = ridData?.observations || '';

    const deleteNote =
`[${new Date().toLocaleDateString()}] RID removido do sistema
Motivo: ${ridDeletionReason}
Removido por: ${currentUserData?.name || 'DEV'}`;

    // ✅ Mantém a "funcionalidade de e-mail" sem usar updates:
    // reseta flags de envio (útil se você tiver lógica de reativar/reverter exclusão)
    // e evita ficar "travado" com emailSent=true
    await ridRef.update({
      // exclusão lógica
      deleted: true,
      status: 'EXCLUIDO',
      deletedAt: firebase.firestore.FieldValue.serverTimestamp(),

      // ✅ quem aprovou/excluiu foi o DEV logado (não o requester)
      deletedBy: {
        uid: currentUser?.uid || null,
        name: currentUserData?.name || 'DEV',
        role: isDeveloper() ? 'DEVELOPER' : 'ADMIN'
      },

      deleteReason: ridDeletionReason,

      // ✅ histórico no campo observações
      observations: previousObs
        ? previousObs + '\n\n' + deleteNote
        : deleteNote,

      // ✅ reset de e-mail (mantém comportamento saudável do sistema)
      emailSent: false,
      emailSentAt: null,

      // opcional: se você usa esse campo pra controlar notificação de líder
      // deixe null pra forçar nova avaliação caso o RID "volte" algum dia
      lastNotifiedLeader: null
    });

    // ✅ marca solicitação como aprovada (com auditoria)
    await db.collection('deleteRequests').doc(requestId).update({
      status: 'approved',
      reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
      reviewedBy: {
        uid: currentUser?.uid || null,
        name: currentUserData?.name || 'DEV'
      }
    });

    // ✅ notifica quem solicitou (requesterId)
    await createNotification(requesterId, {
      type: 'request_approved',
      ridId: '',
      ridNumber: rid?.ridNumber || '',
      title: 'Solicitação Aprovada',
      message: `Sua solicitação de exclusão do RID #${rid?.ridNumber || 'N/A'} foi aprovada`,
      ridLocation: null,
      deadline: null
    });
// ✅ garante que a UI volta pra Solicitações
window.currentPage = 'requests';

    renderRequestsPage();
    showToast('RID excluído com sucesso!');
  } catch (error) {
    showToast('Erro ao excluir RID: ' + error.message, 'error');
  }
}

    function renderReportsPage() {
      const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
     const now = new Date();
const currentMonth = now.getMonth() + 1;
const currentYear = now.getFullYear();

// ✅ Mês/Ano selecionado do RELATÓRIO (se vazio, cai no mês atual)

const yearEl  = document.getElementById('reportYear');

const selectedMonth = monthEl?.value ? Number(monthEl.value) : currentMonth;
const selectedYear  = yearEl?.value  ? Number(yearEl.value)  : currentYear;

// helpers locais (bem seguros)
const toDateSafe = (v) => {
  if (!v) return null;
  if (v instanceof Date) return v;
  if (typeof v.toDate === 'function') return v.toDate(); // Firestore Timestamp
  const parsed = new Date(v);
  return isNaN(parsed.getTime()) ? null : parsed;
};

const isInMonthYear = (d, m, y) => !!d && (d.getMonth() + 1) === m && d.getFullYear() === y;
const isBeforeMonthYear = (d, m, y) => {
  if (!d) return false;
  const dm = d.getMonth() + 1;
  const dy = d.getFullYear();
  return (dy < y) || (dy === y && dm < m);
};

// 🔵 LISTA A: emitidos no mês selecionado (qualquer status)
const reportMonthRids = allRids
  .filter(r => !r.deleted)
  .filter(r => {
    const d = toDateSafe(r.emissionDate);
    return isInMonthYear(d, selectedMonth, selectedYear);
  });

// 🟡 LISTA B: emitidos antes, mas RESOLVIDOS no mês selecionado (status + conclusionDate)

  .filter(r => !r.deleted)
  .filter(r => {
   const emission = toDateSafe(r.emissionDate);

// 🚫 garante que NÃO é do mês atual
if (isInMonthYear(emission, selectedMonth, selectedYear)) return false;

// ✅ garante que é de mês anterior
if (!isBeforeMonthYear(emission, selectedMonth, selectedYear)) return false;


    const st = String(r.status || '').toUpperCase();
    if (st !== 'CORRIGIDO' && st !== 'ENCERRADO') return false;

    const concl = toDateSafe(r.conclusionDate);
    return isInMonthYear(concl, selectedMonth, selectedYear);
  });

// ✅ lista final da tabela com separador
const reportDisplayRids = resolvedPreviousInMonth.length > 0
  ? [
      ...reportMonthRids,
      { __separator: true, label: 'RIDs de meses anteriores resolvidos neste mês' },
      ...resolvedPreviousInMonth
    ]
  : [...reportMonthRids];

 function filterReports() {
  const month = document.getElementById('reportMonth')?.value;
  const year = document.getElementById('reportYear')?.value;
  const sector = document.getElementById('reportSector')?.value;

  const now = new Date();
  const currentMonth = now.getMonth() + 1;
  const currentYear = now.getFullYear();

  const selectedMonth = month ? Number(month) : currentMonth;
  const selectedYear  = year  ? Number(year)  : currentYear;

  const toDateSafe = (v) => {
    if (!v) return null;
    if (v instanceof Date) return v;
    if (typeof v.toDate === 'function') return v.toDate();
    const parsed = new Date(v);
    return isNaN(parsed.getTime()) ? null : parsed;
  };

  const isInMonthYear = (d, m, y) => !!d && (d.getMonth() + 1) === m && d.getFullYear() === y;
  const isBeforeMonthYear = (d, m, y) => {
    if (!d) return false;
    const dm = d.getMonth() + 1;
    const dy = d.getFullYear();
    return (dy < y) || (dy === y && dm < m);
  };

  // base segura
  let base = allRids.filter(r => !r.deleted);
  if (sector) base = base.filter(r => r.sector === sector);

  // 🔵 Seção A: emitidos no mês selecionado (qualquer status)
  const listA = base.filter(r => {
    const emission = toDateSafe(r.emissionDate);
    return isInMonthYear(emission, selectedMonth, selectedYear);
  });

  // 🟡 Seção B: emitidos antes, resolvidos no mês selecionado
  const listB = base.filter(r => {
    const emission = toDateSafe(r.emissionDate);
    if (!isBeforeMonthYear(emission, selectedMonth, selectedYear)) return false;

    const st = String(r.status || '').toUpperCase();
    if (st !== 'CORRIGIDO' && st !== 'ENCERRADO') return false;

    const concl = toDateSafe(r.conclusionDate);
    return isInMonthYear(concl, selectedMonth, selectedYear);
  });

  const finalList = listB.length > 0
    ? [
        ...listA,
        { __separator: true, label: 'RIDs de meses anteriores resolvidos neste mês' },
        ...listB
      ]
    : [...listA];

  document.getElementById('reportTableBody').innerHTML = renderReportRows(finalList);
}

    renderReportRows(currentMonthRids);
}

async function logRidHistory({
  ridId,
  ridNumber,
  action,
  before,
  after
}) {
  const user = auth.currentUser;
  if (!user) return;

  const userSnap = await getDoc(doc(db, "users", user.uid));
  const userData = userSnap.exists() ? userSnap.data() : {};

  await addDoc(collection(db, "ridHistory"), {
    ridId,
    ridNumber,
    action,
    changedFields: Object.keys(after || {}),
    before: before || {},
    after: after || {},
    byUid: user.uid,
    byName: userData.name || "Desconhecido",
    byRole: userData.role || "não definido",
    at: serverTimestamp()
  });
}


async function restoreRid(ridId) {
  const reason = prompt('Informe o motivo da restauração do RID:');
  if (!reason || !reason.trim()) return;

  try {
    const ridRef = db.collection('rids').doc(ridId);
    const ridSnap = await ridRef.get();
    const ridData = ridSnap.data();

    const previousObs = ridData?.observations || '';

    const restoreNote =
`[${new Date().toLocaleDateString()}] RID restaurado no sistema
Motivo: ${reason}
Restaurado por: ${currentUserData.name}`;

    await ridRef.update({
      deleted: false,
      status: 'VENCIDO',
      restoredAt: firebase.firestore.FieldValue.serverTimestamp(),
      restoredBy: {
        uid: currentUser.uid,
        name: currentUserData.name,
        role: 'DEV'
      },
      observations: previousObs
        ? previousObs + '\n\n' + restoreNote
        : restoreNote
    });

    showToast('RID restaurado com sucesso!');
    await loadRids();
renderDevControlCenter();
showRidDetails(ridId);

    showToast('Erro ao restaurar RID: ' + err.message, 'error');
  }

function renderDevRiskChart(base) {
  const canvas = document.getElementById('devRiskChart');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');

  // 🔥 Se existir um gráfico antigo válido, destrói
  if (window.devRiskChart && typeof window.devRiskChart.destroy === 'function') {
    window.devRiskChart.destroy();
  }

  const critical = base.filter(r => r.riskClassification === 'Crítico').length;
  const high = base.filter(r => r.riskClassification === 'Alto').length;
  const medium = base.filter(r => r.riskClassification === 'Médio').length;

  window.devRiskChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Crítico', 'Alto', 'Médio'],
      datasets: [{
        data: [critical, high, medium],
        backgroundColor: ['#dc2626', '#f59e0b', '#10b981']
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'right',
          labels: {
            usePointStyle: true,
            padding: 20
          }
        }
      }
    }
  });
}

async function generateRiskReportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const logo = await loadImageAsBase64('logo.png');
  const now = new Date().toLocaleString();

  let base = window.devFilteredBase || allRids;

  base = base.filter(r => ['Médio', 'Alto', 'Crítico'].includes(r.riskClassification));

  const month = document.getElementById('devMonth')?.value || 'Todos';
  const year = document.getElementById('devYear')?.value || new Date().getFullYear();

  // Agrupar por setor
  const sectors = {};
  base.forEach(r => {
    const s = r.sector || 'SEM SETOR';
    if (!sectors[s]) sectors[s] = [];
    sectors[s].push(r);
  });

  const totalCritical = base.filter(r => r.riskClassification === 'Crítico').length;
  const totalHigh = base.filter(r => r.riskClassification === 'Alto').length;
  const totalMedium = base.filter(r => r.riskClassification === 'Médio').length;
  const total = totalCritical + totalHigh + totalMedium;

  const pctCritical = ((totalCritical / total) * 100).toFixed(1);
  const pctHigh = ((totalHigh / total) * 100).toFixed(1);
  const pctMedium = ((totalMedium / total) * 100).toFixed(1);

  // Ranking
  const ranking = Object.entries(sectors)
    .map(([sector, data]) => ({
      sector,
      critical: data.filter(r => r.riskClassification === 'Crítico').length
    }))
    .sort((a, b) => b.critical - a.critical);

  // ===== Pizza real =====
  function drawPie(doc, cx, cy, r, values, colors) {
    const sum = values.reduce((a, b) => a + b, 0);
    let start = -Math.PI / 2;

    values.forEach((v, i) => {
      const angle = (v / sum) * Math.PI * 2;
      const end = start + angle;

      const points = [[cx, cy]];
      for (let a = start; a <= end; a += 0.05) {
        points.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
      }
      points.push([cx + r * Math.cos(end), cy + r * Math.sin(end)]);

      doc.setFillColor(...colors[i]);
      doc.path(points, 'F');

      start = end;
    });
  }

  // ==================== PÁGINA EXECUTIVA ====================
  doc.addImage(logo, 'PNG', 14, 10, 30, 20);
  doc.setFontSize(18);
  doc.text('Relatório de Gestão de Risco', 50, 20);
  doc.setFontSize(10);
  doc.text(`Gerado em: ${now}`, 50, 28);
  doc.text(`Período: ${month}/${year}`, 14, 40);

  doc.setFontSize(13);
  doc.text('Distribuição de Risco', 14, 55);

  // Barras
  doc.setFillColor(220,80,80); doc.rect(60, 60, pctCritical, 8, 'F');
  doc.setFillColor(240,160,50); doc.rect(60, 75, pctHigh, 8, 'F');
  doc.setFillColor(80,180,120); doc.rect(60, 90, pctMedium, 8, 'F');

  doc.setDrawColor(200);
  doc.rect(60, 60, 100, 8);
  doc.rect(60, 75, 100, 8);
  doc.rect(60, 90, 100, 8);

  doc.text(`Crítico (${pctCritical}%)`, 14, 66);
  doc.text(`Alto (${pctHigh}%)`, 14, 81);
  doc.text(`Médio (${pctMedium}%)`, 14, 96);

  // Pizza
  drawPie(doc, 150, 80, 20, [totalCritical, totalHigh, totalMedium], [
    [220,80,80],
    [240,160,50],
    [80,180,120]
  ]);

  // Ranking
  doc.setFontSize(13);
  doc.text('Setores mais críticos', 14, 130);

  doc.autoTable({
    startY: 135,
    head: [['Posição', 'Setor', 'RIDs Críticas']],
    body: ranking.map((r, i) => [i + 1, r.sector, r.critical]),
    headStyles: { fillColor: [200,80,80], textColor: 255 }
  });

  // ==================== POR SETOR ====================
  for (const sector in sectors) {
    const data = sectors[sector];
    doc.addPage();

    doc.addImage(logo, 'PNG', 14, 10, 30, 20);
    doc.setFontSize(16);
    doc.text('Relatório de Gestão de Risco', 50, 20);
    doc.setFontSize(10);
    doc.text(`Gerado em: ${now}`, 50, 28);

    doc.setFontSize(14);
    doc.text(`SETOR: ${sector}`, 14, 40);

    const critical = data.filter(r => r.riskClassification === 'Crítico');
    const high = data.filter(r => r.riskClassification === 'Alto');
    const medium = data.filter(r => r.riskClassification === 'Médio');

    doc.autoTable({
      startY: 50,
      head: [['Indicador', 'Qtd']],
      body: [
        ['Críticas', critical.length],
        ['Altas', high.length],
        ['Médias', medium.length],
        ['Total', data.length]
      ],
      headStyles: { fillColor: [100,150,180], textColor: 255 }
    });

    doc.autoTable({
      startY: doc.lastAutoTable.finalY + 8,
      head: [['RID', 'Emitente', 'Risco', 'Status']],
      body: data.map(r => [
        `#${r.ridNumber}`,
        r.emitterName || '',
        r.riskClassification,
        r.status
      ]),
      alternateRowStyles: { fillColor: [245,248,250] },
      headStyles: { fillColor: [50,100,160], textColor: 255 }
    });
  }

  doc.save(`Relatorio_Gestao_Risco_${month}_${year}.pdf`);
}



async function loadImageAsBase64(url) {
  const res = await fetch(url);
  const blob = await res.blob();

  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

  rid.status === 'CORRIGIDO'

        const tryGet = x => {
